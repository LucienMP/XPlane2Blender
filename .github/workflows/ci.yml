# Test suite on every push and pull request; add-on packages with the X-Plane plugin on tags.
# The X-Plane visual checks (tests/xplane_visual) need an X-Plane install, so they only run
# locally: python tests.py --xplane
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"

jobs:
  tests:
    name: Headless test suite (Blender ${{ env.BLENDER_VERSION }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ env.BLENDER_VERSION }}-windows
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "blender-$env:BLENDER_VERSION-windows-x64.zip"
          Invoke-WebRequest "https://download.blender.org/release/Blender$env:BLENDER_SERIES/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath blender_zip
          Move-Item (Get-ChildItem blender_zip | Select-Object -First 1).FullName blender
      - name: Run the test suite
        shell: pwsh
        run: python tests.py --blender "$PWD\blender\blender.exe" --print-fails --continue

  plugin:
    name: X-Plane plugin (win.xpl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Download the X-Plane SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile XPSDK430.zip
          Expand-Archive XPSDK430.zip -DestinationPath xpsdk
      - name: Build
        shell: cmd
        working-directory: io_xplane2blender/xplane_parity/plugin
        run: cl /nologo /O2 /LD /DIBM=1 /DXPLM200=1 /DXPLM210=1 /DXPLM300=1 /DXPLM301=1 /DXPLM303=1 /DXPLM400=1 /DXPLM410=1 /DXPLM420=1 /DXPLM430=1 /I"%GITHUB_WORKSPACE%\xpsdk\SDK\CHeaders\XPLM" xp2b_parity.c /link "%GITHUB_WORKSPACE%\xpsdk\SDK\Libraries\Win\XPLM_64.lib" /OUT:win.xpl
      - uses: actions/upload-artifact@v4
        with:
          name: win.xpl
          path: io_xplane2blender/xplane_parity/plugin/win.xpl

  package:
    name: Add-on package
    needs: [tests, plugin]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: win.xpl
          path: io_xplane2blender/xplane_parity/plugin
      - name: Build the zip
        shell: pwsh
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "CI"
          # The freshly built plugin must be tracked for mkbuild's only-tracked file list
          git add -f io_xplane2blender/xplane_parity/plugin/win.xpl
          git commit -q -m "CI: built plugin" --allow-empty
          python mkbuild.py --dest-folder builds
          Get-ChildItem builds
      - uses: actions/upload-artifact@v4
        with:
          name: io_xplane2blender
          path: builds/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.zip
          generate_release_notes: true
